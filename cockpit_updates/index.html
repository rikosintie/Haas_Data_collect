<!DOCTYPE html>
<html>

<head>
    <title>System Updates</title>
    <meta charset="utf-8">
    <script src="../base1/cockpit.js"></script>
    <link rel="stylesheet" href="update.css">
</head>

<body>

    <h1>System Updates</h1>

    <div id="status" class="status warn">Checking status...</div>
    <div class="meta" id="lastRun">Last updated: never</div>

    <button id="checkBtn" title="Check for Ubuntu updates">Check</button>
    <button id="updateBtn" title="Install updates from Ubuntu (Canonical)">Install</button>
    <button id="rebootBtn" title="Immediately reboot the appliance">Reboot</button>
    <button id="syncToolsBtn" title="Install or update 3rd party tools included with the appliance">Sync Tools</button>

    <hr>
    <h1>Logs</h1>
    <div id="logButtons">
        <button id="cockpitLogBtn" title="Display the live Cockpit log">Cockpit</button>
        <button id="sshLogBtn" title="Display the live SSH log">SSH</button>
        <button id="sambaLogBtn" title="Display the live Samba log">Samba</button>
        <button id="authLogBtn" title="Display the live authentication log">Auth</button>
        <button id="ufwLiveBtn" title="Display the live UFW firewall log">Firewall</button>
        <button id="stopLogBtn" disabled>Stop</button>
    </div>
    <fieldset id="ufwFilter">
        <legend>Filter Firewall Log</legend>
        <label><input type="radio" name="ufwFilter" value="all" checked disabled> All</label>
        <label><input type="radio" name="ufwFilter" value="block" disabled> BLOCK</label>
        <label><input type="radio" name="ufwFilter" value="allow" disabled> ALLOW</label>
        <label><input type="radio" name="ufwFilter" value="audit" disabled> Audit</label>
    </fieldset>

    <div id="tableContainer"></div>

    <pre id="output"></pre>

    <script src="update.js"></script>

</body>

</html>
