<!DOCTYPE html>
<html>

<head>
    <title>System Updates</title>
    <meta charset="utf-8">
    <script src="../base1/cockpit.js"></script>
    <link rel="stylesheet" href="update.css">
</head>

<body>

    <h1>System Updates</h1>

    <div id="status" class="status warn">Checking update status...</div>
    <div class="meta" id="lastRun">Last updated: never</div>

    <button id="checkBtn" data-tooltip="Check for Ubuntu updates">Check</button>
    <button id="updateBtn" data-tooltip="Install updates from Ubuntu (Canonical)">Install</button>
    <button id="rebootBtn" data-tooltip="Immediately reboot the appliance">Reboot</button>
    <button id="syncToolsBtn" data-tooltip="Install or update 3rd party tools included with the appliance">Sync Tools</button>
    <button id="editSyncToolsBtn" data-tooltip="Edit the list of tools that Sync Tools installs">Edit Sync Tools</button>

    <hr>
    <h1>Logs</h1>
    <div id="logButtons">
        <button id="cockpitLogBtn" data-tooltip="Display the live Cockpit log">Cockpit</button>
        <button id="sshLogBtn" data-tooltip="Display the live SSH log">SSH</button>
        <button id="sambaLogBtn" data-tooltip="Display the live Samba log">Samba</button>
        <button id="authLogBtn" data-tooltip="Display the live authentication log">Auth</button>
        <button id="ufwLiveBtn" data-tooltip="Display the live UFW firewall log">Firewall</button>
        <button id="scriptsLogBtn" data-tooltip="CNC machines with Connection refused">Scripts</button>
        <button id="stopLogBtn" disabled>Stop</button>
    </div>
    <fieldset id="ufwFilter">
        <legend>Filter Firewall Log</legend>
        <label><input type="radio" name="ufwFilter" value="all" checked disabled> All</label>
        <label><input type="radio" name="ufwFilter" value="block" disabled> BLOCK</label>
        <label><input type="radio" name="ufwFilter" value="allow" disabled> ALLOW</label>
        <label><input type="radio" name="ufwFilter" value="audit" disabled> Audit</label>
    </fieldset>
    <fieldset id="scriptsFilter">
        <legend>Filter Scripts Log</legend>
        <label>IP <input type="text" id="scriptsIpFilter" placeholder="e.g. 192.168.10.141" size="18" disabled></label>
        <label>Port <input type="text" id="scriptsPortFilter" placeholder="e.g. 5053" size="6" disabled></label>
    </fieldset>

    <hr>
    <h1>Services</h1>
    <div id="servicesButtons">
        <button id="serviceStateBtn" data-tooltip="View Haas service status">Service State</button>
        <button id="editServicesBtn" data-tooltip="Edit Haas service files">Edit Services</button>
        <button id="createServiceBtn" data-tooltip="Create new Haas service file">Create Service</button>
        <button id="deleteServiceBtn" data-tooltip="Stop, disable, and delete a Haas service">Delete Service</button>
        <button id="dataFreshnessBtn" data-tooltip="Show when each machine last wrote CSV data">Data Freshness</button>
    </div>
    <select id="servicesList" class="services-select hidden">
        <option value="">— select a service file —</option>
    </select>

    <div id="tableContainer"></div>

    <pre id="output"></pre>

    <div id="serviceEditorSection" class="hidden">
        <div id="serviceEditorLabel"></div>
        <pre id="editorValidationMsg" class="hidden"></pre>
        <div class="editor-buttons">
            <button id="saveServiceBtn">Save &amp; Restart</button>
            <button id="cancelServiceEditBtn">Cancel</button>
        </div>
        <div id="createServiceForm" class="hidden">
            <div class="csf-field">
                <label for="svcDescription">Description</label>
                <input type="text" id="svcDescription" placeholder="Haas Python logger for MACHINE" maxlength="40">
            </div>
            <div class="csf-field">
                <label for="svcName">Machine Name</label>
                <input type="text" id="svcName" placeholder="e.g. minimill" maxlength="30">
            </div>
            <div class="csf-field">
                <label for="svcIpAddress">IP Address</label>
                <input type="text" id="svcIpAddress" placeholder="e.g. 192.168.10.143">
            </div>
            <div class="csf-field">
                <label for="svcPort">Port</label>
                <input type="text" id="svcPort" placeholder="e.g. 5055 (range: 5001-5099)">
            </div>
        </div>
        <textarea id="serviceEditorArea"></textarea>
    </div>

    <script src="update.js"></script>

</body>

</html>
