<!DOCTYPE html>
<html>

<head>
    <title>System Updates</title>
    <meta charset="utf-8">
    <script src="../base1/cockpit.js"></script>
    <link rel="stylesheet" href="update.css">
</head>

<body>

    <h1>System Updates</h1>

    <div id="status" class="status warn">Checking status...</div>
    <div class="meta" id="lastRun">Last updated: never</div>

    <button id="checkBtn">Check</button>
    <button id="updateBtn">Install</button>
    <button id="rebootBtn">Reboot</button>
    <button id="syncToolsBtn">Sync Tools</button>

    <hr>
    <h3>Logs</h3>
    <div id="logButtons">
        <button id="cockpitLogBtn">Cockpit</button>
        <button id="sshLogBtn">SSH</button>
        <button id="sambaLogBtn">Samba</button>
        <button id="authLogBtn">Auth</button>
        <button id="ufwLogBtn">UFW Log</button>
        <button id="ufwLiveBtn">UFW Live</button>
        <button id="stopLogBtn" disabled>Stop</button>
    </div>

    <div id="tableContainer"></div>

    <pre id="output"></pre>

    <script src="update.js"></script>

</body>

</html>
