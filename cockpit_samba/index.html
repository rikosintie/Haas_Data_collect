<!DOCTYPE html>
<html>

<head>
    <title>Manage Samba</title>
    <meta charset="utf-8">
    <script src="../base1/cockpit.js"></script>
    <link rel="stylesheet" href="samba.css">
</head>

<body>

    <div class="page-header">
        <h1>Manage Samba</h1>
        <button id="helpBtn" data-tooltip="Open the full documentation for this page in a new tab">Help</button>
    </div>
    <div id="network-info" class="network-info">Loading network info...</div>

    <div id="actionButtons">
        <button id="editConfBtn" data-tooltip="Open smb.conf in the editor">Edit smb.conf</button>
        <button id="saveRestartBtn" data-tooltip="Save changes to smb.conf and restart the Samba service" disabled>Save &amp; Restart</button>
        <button id="createShareBtn" data-tooltip="Add a new share to smb.conf">Create Share</button>
        <button id="deleteShareBtn" data-tooltip="Stop sharing a machine directory">Delete Share</button>
        <button id="displaySharesBtn" data-tooltip="Display the Samba shares from smb.conf">Display Shares</button>
        <button id="displaySharesCsvBtn" data-tooltip="Display the Samba shares from smb.conf in CSV format">Shares CSV</button>
        <button id="displaySambaUsersBtn" data-tooltip="List all users in the Samba database">Samba Users</button>
        <button id="displayLinuxUsersBtn" data-tooltip="Display local user accounts defined in Linux">Linux Users</button>
        <button id="clearOutputBtn" data-tooltip="Clear the output window">Clear Output</button>
    </div>

    <div id="userRow">
        <input type="text" id="usernameInput" placeholder="Enter username">
        <button id="displaySharesByUserBtn" data-tooltip="Display active Samba sessions for the specified user">Shares by User</button>
    </div>

    <select id="sharesList" class="hidden">
        <option value="">— select a share to delete —</option>
    </select>

    <div id="panelLabel"></div>
    <pre id="validationMsg" class="hidden"></pre>
    <div id="panel">
        <textarea id="confEditor" spellcheck="false"></textarea>
        <pre id="output">Ready.</pre>
        <div id="createShareForm" class="hidden">
            <div class="csf-field">
                <label for="shareMachineName">Machine Name</label>
                <input type="text" id="shareMachineName" placeholder="e.g. st30l" maxlength="30">
            </div>
            <div class="csf-field">
                <label for="shareComment">Comment</label>
                <input type="text" id="shareComment" placeholder="e.g. File share for st30l" maxlength="60">
            </div>
        </div>
    </div>

    <script src="samba.js"></script>

</body>

</html>
