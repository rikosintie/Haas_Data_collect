<!DOCTYPE html>
<html>

<head>
    <title>Manage Samba</title>
    <meta charset="utf-8">
    <script src="../base1/cockpit.js"></script>
    <link rel="stylesheet" href="samba.css">
</head>

<body>

    <div class="page-header">
        <h1>Manage Samba</h1>
        <button id="helpBtn" data-tooltip="Open the full documentation for this page in a new tab">Help</button>
    </div>
    <div id="network-info" class="network-info">Loading network info...</div>

    <div id="actionButtons">
        <button id="editConfBtn" data-tooltip="Open smb.conf in the editor">Edit smb.conf</button>
        <button id="saveRestartBtn" data-tooltip="Save changes to smb.conf and restart the Samba service" disabled>Save &amp; Restart</button>
        <button id="createShareBtn" data-tooltip="Add a new share to smb.conf">Create Share</button>
        <button id="deleteShareBtn" data-tooltip="Stop sharing a machine directory">Delete Share</button>
        <button id="displaySharesBtn" data-tooltip="Display the Samba shares from smb.conf">Display Shares</button>
        <button id="displaySharesCsvBtn" data-tooltip="Display the Samba shares from smb.conf in CSV format">Shares CSV</button>
        <button id="displaySambaUsersBtn" data-tooltip="List all users in the Samba database">Samba Users</button>
        <button id="displayLinuxUsersBtn" data-tooltip="Display local user accounts defined in Linux">Linux Users</button>
        <button id="createUserBtn" data-tooltip="Create a new Linux + Samba user account">Create User</button>
        <button id="deleteUserBtn" data-tooltip="Remove a Linux + Samba user account">Delete User</button>
        <button id="changePasswordBtn" data-tooltip="Set a new password for an existing user">Change Password</button>
        <button id="clearOutputBtn" data-tooltip="Clear the output window">Clear Output</button>
    </div>

    <div id="userRow">
        <input type="text" id="usernameInput" placeholder="Enter username">
        <button id="displaySharesByUserBtn" data-tooltip="Display active Samba sessions for the specified user">Shares by User</button>
    </div>

    <select id="sharesList" class="hidden">
        <option value="">— select a share to delete —</option>
    </select>

    <select id="usersList" class="hidden">
        <option value="">— select a user to delete —</option>
    </select>

    <select id="changePasswordList" class="hidden">
        <option value="">— select a user to change password —</option>
    </select>

    <div id="panelLabel"></div>
    <pre id="validationMsg" class="hidden"></pre>
    <div id="panel">
        <textarea id="confEditor" spellcheck="false"></textarea>
        <pre id="output">Ready.</pre>
        <div id="createShareForm" class="hidden">
            <div class="csf-field">
                <label for="shareMachineName">Machine Name</label>
                <input type="text" id="shareMachineName" placeholder="e.g. st30l" maxlength="30">
            </div>
            <div class="csf-field">
                <label for="shareComment">Comment</label>
                <input type="text" id="shareComment" placeholder="e.g. File share for st30l" maxlength="60">
            </div>
        </div>
        <div id="createUserForm" class="hidden">
            <div class="csf-field">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" placeholder="e.g. jdoe" maxlength="32">
            </div>
            <div class="csf-field">
                <label for="newUserRole">Role</label>
                <select id="newUserRole">
                    <option value="user">Standard user (Samba share access only)</option>
                    <option value="admin">Administrator (SSH + sudo + Samba)</option>
                </select>
            </div>
            <div class="csf-field">
                <label for="newUserPassword">Password</label>
                <input type="password" id="newUserPassword" autocomplete="new-password">
            </div>
            <div class="csf-field">
                <label for="newUserPasswordConfirm">Confirm Password</label>
                <input type="password" id="newUserPasswordConfirm" autocomplete="new-password">
            </div>
        </div>
        <div id="changePasswordForm" class="hidden">
            <div class="csf-field">
                <label for="changePasswordUsername">Username</label>
                <input type="text" id="changePasswordUsername" readonly>
            </div>
            <div class="csf-field">
                <label for="changePasswordNew">New Password</label>
                <input type="password" id="changePasswordNew" autocomplete="new-password">
            </div>
            <div class="csf-field">
                <label for="changePasswordConfirm">Confirm Password</label>
                <input type="password" id="changePasswordConfirm" autocomplete="new-password">
            </div>
            <div class="csf-field">
                <label></label>
                <div class="button-row">
                    <button id="changePasswordSubmitBtn">Set New Password</button>
                    <button id="changePasswordCancelBtn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="samba.js"></script>

</body>

</html>
